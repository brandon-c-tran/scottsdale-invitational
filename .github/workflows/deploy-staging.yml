name: Deploy staging to Cloudflare

# Staging is the iteration target: an isolated Worker on workers.dev with its
# own Durable Object and no custom domain, so a deploy here can never touch
# live state. Still a named, deliberate action, same as production.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to deploy
        required: false
        default: master

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Staging carries the same gates as production. A broken build should
      # never reach the Worker the rehearsal runs against.
      - run: npm run check
      - run: npm test

      # The target is deliberately named. The generic deploy script refuses to
      # choose production or staging on the operator's behalf.
      - run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The PIN lives only as a Worker secret. This step is skipped unless a
      # STAGING_GM_PIN repository secret exists, so a staging Worker whose PIN
      # was set by hand keeps the one it already has.
      - name: Sync staging GM PIN
        if: ${{ secrets.STAGING_GM_PIN != '' }}
        run: printf '%s' "$STAGING_GM_PIN" | npx wrangler secret put GM_PIN
        env:
          STAGING_GM_PIN: ${{ secrets.STAGING_GM_PIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
