name: Deploy production to Cloudflare

# Production is a manual, protected action. Staging has a separate named
# Wrangler target and must never reuse this job implicitly.
on:
  workflow_dispatch: {}

# A newer push cancels an in-flight deploy for the same branch, so rapid
# iteration never stacks up half-finished deploys.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The target is deliberately named. The generic deploy script refuses to
      # choose production or staging on the operator's behalf.
      - run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
