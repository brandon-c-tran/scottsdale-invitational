name: Deploy to Cloudflare

# Auto-deploys the app to the live Cloudflare Worker on every push.
# Push from your branch and your installed PWA updates in ~30s (pull-to-refresh
# to clear the service worker cache). master is covered too, for after merges.
on:
  push:
    branches: [master, "claude/**"]
  workflow_dispatch: {}

# A newer push cancels an in-flight deploy for the same branch, so rapid
# iteration never stacks up half-finished deploys.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs the project's own script (vite build && wrangler deploy) so the
      # pinned wrangler 4.x is used - it reads wrangler.jsonc, which older
      # wrangler bundled by third-party actions does not.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
