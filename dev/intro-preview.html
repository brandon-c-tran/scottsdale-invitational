<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Game intros</title>
  <link rel="preload" href="/fonts/big-shoulders-display-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/big-shoulders-inline-display-latin.woff2" as="font" type="font/woff2" crossorigin />
  <!-- ?reduced=1 answers the reduced-motion query before any module reads it -->
  <script>
    if (new URLSearchParams(location.search).get("reduced") === "1") {
      const real = window.matchMedia.bind(window);
      window.matchMedia = query => /reduce/.test(query)
        ? { matches:true, media:query, addEventListener() {}, removeEventListener() {}, addListener() {}, removeListener() {} }
        : real(query);
    }
  </script>
</head>

</html>
