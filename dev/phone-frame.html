<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phone frame</title>
  <style>body { margin:0; background:#000; } iframe { border:0; display:block; }</style>
</head>
<!-- scratch: a real 390px viewport for headless screenshots (Chrome's window
     will not go below ~500px). ?src=<path>&w=390&h=2400 -->
<body><script>
  const q = new URLSearchParams(location.search);
  const frame = document.createElement("iframe");
  frame.width = q.get("w") || 390; frame.height = q.get("h") || 2400;
  frame.src = q.get("src");
  document.body.append(frame);
</script></body>
</html>
